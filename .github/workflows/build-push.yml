name: Build and Push  # name shown in the GitHub Actions tab

on:
  push:
    branches:
      - main  # only trigger on pushes to main, not on feature branches

jobs:
  build-push:          # job name
    runs-on: ubuntu-latest  # run on a GitHub-hosted Ubuntu runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # clones the repo into the runner

      - name: Log in to Docker Hub
        uses: docker/login-action@v3  # official Docker action for registry authentication
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # pulled from GitHub Secrets — never hardcoded
          password: ${{ secrets.DOCKERHUB_TOKEN }}      # Docker Hub personal access token (Read & Write)

      - name: Extract metadata for Docker
        id: meta  # assigns an ID so later steps can reference this step's outputs
        uses: docker/metadata-action@v5  # official Docker action that generates image tags automatically
        with:
          images: gnurg/cicd-k8s-webapp  # the Docker Hub repository to tag
          tags: |
            type=sha        # generates a tag from the commit SHA (e.g. sha-a1b2c3d) — uniquely identifies every build
            type=raw,value=latest,enable={{is_default_branch}}  # also tags as "latest" when on the default branch (main)

      - name: Build and push Docker image
        uses: docker/build-push-action@v6  # official Docker action for building and pushing images
        with:
          context: Dockerapp      # directory used as the Docker build context
          file: Dockerapp/Dockerfile  # path to the Dockerfile
          push: true              # push the image to Docker Hub after building
          tags: ${{ steps.meta.outputs.tags }}  # use the tags generated by the metadata step above

  # -----------------------------------------------------------------------
  # DEPLOY JOB — currently incomplete, requires a reachable cluster
  # -----------------------------------------------------------------------
  # This job will automatically deploy to dev after a successful build.
  # It is stubbed out here to document the intended flow.
  # It will be completed when the cluster is migrated to AWS EKS,
  # which exposes a kubeconfig that GitHub Actions can connect to.
  # -----------------------------------------------------------------------
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-push  # only runs after build-push succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO: uncomment when AWS EKS is configured
      # - name: Configure kubectl
      #   uses: aws-actions/amazon-eks-update-kubeconfig@v1  # sets up kubectl to talk to EKS
      #   with:
      #     cluster-name: cicd-k8s-cluster
      #     region: eu-west-1

      - name: Update image tag in dev overlay
        # Updates the image tag in the Kustomize overlay to the exact commit SHA
        # so the deployment is always traceable to a specific build
        run: |
          cd k8s/overlays/dev
          kustomize edit set image gnurg/cicd-k8s-webapp=gnurg/cicd-k8s-webapp:sha-${{ github.sha }}

      # TODO: uncomment when kubectl is connected to the cluster
      # - name: Deploy to dev
      #   run: kubectl apply -k k8s/overlays/dev
